<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Mart - POS Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-wrapper">
                <h1>🛒 BMS Mart POS</h1>
                <span class="status-badge"><span class="status-dot"></span> Terminal Active</span>
            </div>
            <div class="header-actions">
                <span class="time" id="currentTime">--:--:--</span>
                <button onclick="window.location.href='admin.html'" class="btn btn-outline">Admin Panel</button>
            </div>
        </header>

        <div class="pos-container">
            <!-- Left: Catalog & Category Filter Pane -->
            <div class="products-section">
                <div class="search-bar">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search by SKU code or product name..." autocomplete="off">
                    </div>
                    <button onclick="searchProducts()" class="btn btn-primary">Search</button>
                </div>

                <div class="categories-filter">
                    <button class="category-btn active" onclick="filterByCategory('all')">All Items</button>
                    <div id="categoriesContainer" style="display: contents;"></div>
                </div>

                <div class="products-grid" id="productsGrid"></div>
            </div>

            <!-- Right: Sticky Live Order Cart (420px) -->
            <div class="cart-section">
                <div class="cart-header">
                    <h2>Order Basket</h2>
                    <span id="cartCountBadge" class="cart-count-badge">0 items</span>
                </div>

                <div class="cart-items" id="cartItems"></div>
                
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal" class="numeric">₹0.00</span>
                    </div>
                    <div class="summary-row tax-row">
                        <span id="cgstLabel">CGST (2.5%)</span>
                        <span id="cgst" class="numeric">₹0.00</span>
                    </div>
                    <div class="summary-row tax-row">
                        <span id="sgstLabel">SGST (2.5%)</span>
                        <span id="sgst" class="numeric">₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total Payable</span>
                        <span id="total" class="numeric">₹0.00</span>
                    </div>
                </div>

                <div class="customer-info">
                    <div class="customer-info-grid">
                        <input type="text" id="customerName" class="form-control" placeholder="Customer Name *" required>
                        <input type="tel" id="customerContact" class="form-control" placeholder="Contact Phone *" required>
                    </div>
                    <input type="email" id="customerEmail" class="form-control" placeholder="Email (Optional)" style="margin-top: 8px;">
                </div>

                <div class="payment-method">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod" class="form-control">
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Card</option>
                    </select>
                </div>

                <div class="cart-actions">
                    <button onclick="checkout()" class="btn btn-checkout btn-large">Complete Sale & Print Bill</button>
                    <button onclick="clearCart()" class="btn btn-outline btn-large">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bill Modal -->
    <div id="billModal" class="modal">
        <div class="modal-content bill-content">
            <button class="close" onclick="closeBill()">&times;</button>
            <div id="billContainer"></div>
            <button onclick="printBill()" class="btn btn-primary btn-large" style="margin-top: 16px;">Print Receipt</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
